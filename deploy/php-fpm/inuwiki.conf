; =============================================================
; INUWIKI PHP-FPM 进程池
; 放置：/etc/php/8.2/fpm/pool.d/inuwiki.conf
;
; 说明：INUEIP 与 INUWIKI 共用同一个 php-fpm 进程池即可（业务代码量小），
; 若需故障隔离可复制一份改 listen 与 pm.max_children。
; =============================================================

[inuwiki]
user  = www-data
group = www-data

listen = /run/php/php8.2-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; 100 人同时操作（峰值并发 60-100）：80 个子进程留足余量
pm = dynamic
pm.max_children      = 80
pm.start_servers     = 12
pm.min_spare_servers = 8
pm.max_spare_servers = 24
pm.max_requests      = 1000      ; 防内存泄漏累积

; 状态页：压测时观察 active processes 是否被视频请求占满
pm.status_path = /phpfpm-status
ping.path      = /phpfpm-ping

; 超时：正常 API 很短；上传分片接口略长
request_terminate_timeout = 120s
request_slowlog_timeout   = 5s
slowlog = /var/log/php8.2-fpm.inuwiki.slow.log

php_admin_value[memory_limit]      = 512M
php_admin_value[upload_max_filesize] = 8M     ; 与分片大小 5MB 联动
php_admin_value[post_max_size]       = 10M
php_admin_value[max_execution_time]  = 60

; 环境
env[APP_ENV] = production
