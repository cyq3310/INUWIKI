; =============================================================
; INUWIKI 队列 Worker（分片合并 + FFmpeg 转码）
; 放置：/etc/supervisor/conf.d/kb-worker.conf
; 生效：supervisorctl reread && supervisorctl update && supervisorctl start kb-worker:*
;
; ⚠️ numprocs 建议 1-2：FFmpeg 转码吃 CPU，并发过高会拖慢在线请求
; =============================================================

[program:kb-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/inuwiki/backend/think queue:work --queue inuwiki --sleep 3 --tries 1 --timeout 3600
directory=/var/www/inuwiki/backend
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/kb-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=3600
killasgroup=true
stopasgroup=true
