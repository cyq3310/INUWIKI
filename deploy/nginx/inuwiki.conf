# =============================================================
# INUWIKI 知识库 · Nginx 配置（单域名按路径分发）
# 放置：/etc/nginx/conf.d/inuwiki.conf
#
# 路径规划：
#   /            → INUEIP 前端静态产物
#   /api/        → INUEIP 后端（PHP-FPM）
#   /kb/         → INUWIKI 前端静态产物
#   /kbapi/      → INUWIKI 后端（PHP-FPM）
#   /uploads/    → INUEIP 上传静态资源
#   /kbuploads/  → 已停用（原 INUWIKI 上传静态直出，现统一走 /kbapi/assets 鉴权）
#   /internal-media/  → INUWIKI 媒体（internal，仅允许 X-Accel-Redirect 内部访问）
# =============================================================

upstream php_fpm {
    server unix:/run/php/php8.2-fpm.sock;
}

server {
    listen 80;
    server_name _;

    root /var/www/inueip/frontend/dist;
    index index.html;

    client_max_body_size 12m;      # 与分片大小 5MB 联动，无需放开到 1GB
    client_body_timeout  120s;
    sendfile            on;        # 零拷贝发送，视频传输关键
    tcp_nopush          on;
    tcp_nodelay         on;

    add_header X-Content-Type-Options nosniff always;

    # ---------- INUEIP 后端 ----------
    location /api/ {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ ^/api/.*\.php$ {
        return 404;
    }

    location /index.php {
        include fastcgi_params;
        fastcgi_pass php_fpm;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/inueip/backend/public/index.php;
        fastcgi_read_timeout 120s;
    }

    # ---------- INUWIKI 前端 ----------
    location /kb/ {
        alias /var/www/inuwiki/frontend/dist/;
        try_files $uri $uri/ /kb/index.html;
    }

    # ---------- INUWIKI 后端 ----------
    location /kbapi/ {
        try_files $uri $uri/ /kbindex.php$is_args$args;
    }

    location = /kbindex.php {
        include fastcgi_params;
        fastcgi_pass php_fpm;
        fastcgi_param SCRIPT_FILENAME /var/www/inuwiki/backend/public/index.php;
        fastcgi_read_timeout 120s;

        # 操作日志来源 IP：即使前面再挂一层代理，也要把真实客户端 IP 传给 PHP。
        # 必须用 $proxy_add_x_forwarded_for 追加，不能透传客户端自带的 $http_x_forwarded_for。
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        # 资源票据 cookie 是否带 Secure 由后端 Request::isSsl() 按真实协议判定。
        # include fastcgi_params 已提供 REQUEST_SCHEME / HTTPS，直连 HTTP/HTTPS 均正确。
        # 若 TLS 在前置反代终止，需在此显式透传「可信」的 X-Forwarded-Proto，
        # 并确认该头不被客户端伪造（见部署说明 9.12）。
    }

    # INUWIKI 上传资源禁止外部直出：统一由 /kbapi/assets 鉴权后经
    # /internal-media/ 下发。否则知道 path 即可绕过文章可见性读取图片。
    # 生产 upload.root=/data/inuwiki，/kbuploads/ 曾是其公开别名，必须一并封禁。
    location ^~ /uploads/knowledge/ {
        return 404;
    }
    location ^~ /kbuploads/ {
        return 404;
    }

    # ---------- INUEIP 上传静态资源（可公开缓存） ----------
    location /uploads/ {
        alias /var/www/inueip/backend/public/uploads/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 禁止执行 PHP，杜绝上传漏洞
        location ~ \.php$ { deny all; }
    }

    # ---------- 媒体播放：internal，只能由后端 X-Accel-Redirect 触发 ----------
    # 与 backend/config/myconfig.php 的 media.internal_prefix 严格一致
    location /internal-media/ {
        internal;                   # 关键：外部直接访问返回 404
        alias /data/inuwiki/;       # 与 myconfig.upload.root 指向同一目录
        sendfile on;
        sendfile_max_chunk 2m;      # 大文件分片发送，避免单连接长时间占用
        # 静态文件原生支持 Range(206)，拖拽播放无需额外配置
        add_header Accept-Ranges bytes;
        # 保留后端 X-Accel-Redirect 响应里的文件名，避免下载后文件名变成 URL 末尾 ID
        add_header Content-Disposition $upstream_http_content_disposition always;
    }

    # ---------- 前端 history 路由回退（INUEIP） ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 安全：禁止访问隐藏文件与备份文件 ----------
    location ~ /\. {
        deny all;
    }
    location ~* \.(sql|bak|old|swp)$ {
        deny all;
    }
}
